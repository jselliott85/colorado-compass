name: Dyson cloud smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-dyson-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read Dyson daily history
        env:
          DYSON_TOKEN: ${{ secrets.DYSON_TOKEN }}
          DYSON_DEVICE_SERIAL: ${{ secrets.DYSON_DEVICE_SERIAL }}
        run: python3 -B side-projects/dyson-air-quality/smoke_test.py
